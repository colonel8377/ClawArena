name: Deploy (Frontend + Backend)

on:
  push:
    branches: [main, pre, dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'railway.toml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: dev
        type: choice
        options:
          - prod
          - pre
          - dev

jobs:
  env-mapping:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.map.outputs.deploy_env }}
      railway_env: ${{ steps.map.outputs.railway_env }}
      api_url: ${{ steps.map.outputs.api_url }}
      app_env: ${{ steps.map.outputs.app_env }}
      vercel_prod: ${{ steps.map.outputs.vercel_prod }}
    steps:
      - id: map
        shell: bash
        run: |
          TARGET="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}"

          if [ "$TARGET" = "main" ] || [ "$TARGET" = "prod" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
            echo "railway_env=production" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "app_env=prod" >> "$GITHUB_OUTPUT"
            echo "vercel_prod=true" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "pre" ]; then
            echo "deploy_env=pre" >> "$GITHUB_OUTPUT"
            echo "railway_env=preview" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api-pre.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "app_env=pre" >> "$GITHUB_OUTPUT"
            echo "vercel_prod=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
            echo "railway_env=development" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api-dev.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
            echo "vercel_prod=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: env-mapping
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_API_URL: ${{ needs.env-mapping.outputs.api_url }}
      NEXT_PUBLIC_APP_ENV: ${{ needs.env-mapping.outputs.app_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel Environment (prod)
        if: needs.env-mapping.outputs.vercel_prod == 'true'
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel Environment (preview)
        if: needs.env-mapping.outputs.vercel_prod != 'true'
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Frontend (inject NEXT_PUBLIC_API_URL + NEXT_PUBLIC_APP_ENV)
        working-directory: frontend
        run: |
          NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
          NEXT_PUBLIC_APP_ENV="$NEXT_PUBLIC_APP_ENV" \
          vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Frontend (prod)
        if: needs.env-mapping.outputs.vercel_prod == 'true'
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy Frontend (preview)
        if: needs.env-mapping.outputs.vercel_prod != 'true'
        working-directory: frontend
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    needs: env-mapping
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend (prod)
        if: needs.env-mapping.outputs.deploy_env == 'prod'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
        run: railway up --service backend_prod --environment production --detach --ci

      - name: Deploy Backend (pre)
        if: needs.env-mapping.outputs.deploy_env == 'pre'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRE }}
        run: railway up --service backend_prev --environment preview --detach --ci

      - name: Deploy Backend (dev)
        if: needs.env-mapping.outputs.deploy_env == 'dev'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
        run: railway up --service backend_dev --environment development --detach --ci
