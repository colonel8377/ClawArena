# Docker Compose for Production Deployment
#
# This configuration provides:
# - Backend service optimized for production
# - Frontend service built for production
# - MySQL database with persistent storage
# - Redis for caching and session management
#
# Usage:
#   Build and start: docker compose -f docker-compose.prod.yml up -d
#   View logs:       docker compose -f docker-compose.prod.yml logs -f
#   Stop:            docker compose -f docker-compose.prod.yml down
#   Update:          docker compose -f docker-compose.prod.yml up -d --build

services:
  # ==========================================================================
  # Frontend Service (Next.js - Production Build)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arena_frontend_prod
    ports:
      - "3000:3000"
    environment:
      # Configure API URL for production
      - NEXT_PUBLIC_API_URL=https://your-backend-domain.com
      # Add any other production environment variables
    networks:
      - arena_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Backend Service (FastAPI + Socket.IO - Production)
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: arena_backend_prod
    ports:
      - "8000:8000"
    environment:
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000

      # Production Security Settings
      - DEV_MODE=false
      - LOCAL_DEBUG_MODE=false

      # Database Configuration (connects to mysql service)
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}

      # Redis Configuration (connects to redis service)
      - REDIS_URL=redis://redis:6379/0

      # CORS - Set specific domains in production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}

      # Blockchain Configuration
      - CHAIN_ID=${CHAIN_ID}
      - WEB3_PROVIDER_URL=${WEB3_PROVIDER_URL}
      - ARENA_VAULT_ADDRESS=${ARENA_VAULT_ADDRESS}
      - SERVER_PRIVATE_KEY=${SERVER_PRIVATE_KEY}

      # Game Settings
      - DEFAULT_SMALL_BLIND=${DEFAULT_SMALL_BLIND:-10}
      - DEFAULT_BIG_BLIND=${DEFAULT_BIG_BLIND:-20}
      - DEFAULT_STARTING_CHIPS=${DEFAULT_STARTING_CHIPS:-1000}

      # Rate Limiting
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-5}
      - RATE_LIMIT_WITHDRAWAL=${RATE_LIMIT_WITHDRAWAL:-3}
      - RATE_LIMIT_GENERAL=${RATE_LIMIT_GENERAL:-10}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - arena_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # MySQL Database (Production)
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: arena_mysql_prod
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      # Persist database data
      - mysql_prod_data:/var/lib/mysql
      # Initialize database with schema
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - arena_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: --default-authentication-plugin=mysql_native_password

  # ==========================================================================
  # Redis (Production)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: arena_redis_prod
    volumes:
      # Persist Redis data
      - redis_prod_data:/data
    networks:
      - arena_network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==========================================================================
# Networks
# ==========================================================================
networks:
  arena_network:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local