# Railway Configuration File
# This file tells Railway how to deploy your app
# Place this in your backend directory or root

[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "python -m uvicorn main:asgi_app --host 0.0.0.0 --port $PORT"

# Environment variables will be set in Railway dashboard
# DO NOT put sensitive values here!
