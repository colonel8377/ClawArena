name: Backend Deploy (Railway)

on:
  push:
    branches: [main, pre, dev]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        # 这一步是核心：根据分支动态决定使用哪个 Token 和哪个服务名
        run: |
          # 1. 根据分支判断环境
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Target: PRODUCTION"
            export RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN_PROD }}
            export RAILWAY_ENV="production"
            export SERVICE_NAME="backend_prod"
          
          elif [ "${{ github.ref_name }}" = "pre" ]; then
            echo "Target: PREVIEW"
            export RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN_PRE }}
            export RAILWAY_ENV="preview"
            export SERVICE_NAME="backend_prev"
          
          else
            echo "Target: DEVELOPMENT"
            export RAILWAY_TOKEN=${{ secrets.RAILWAY_TOKEN_DEV }}
            export RAILWAY_ENV="development"
            export SERVICE_NAME="backend_dev"
          fi


          # 2. 执行部署
          # 注意：有了环境特定的 Token，CLI 会自动识别目标环境，
          # 但如果你的服务名在不同环境不一样，还是需要 --service 指定名字
          railway up --service $SERVICE_NAME --environment $RAILWAY_ENV --detach --ci
