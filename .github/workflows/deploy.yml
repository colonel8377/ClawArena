name: Deploy (Frontend + Backend)

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'railway.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main, pre]
    types: [closed]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'railway.toml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: dev
        type: choice
        options:
          - prod
          - pre
          - dev

jobs:
  env-mapping:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.map.outputs.deploy_env }}
      railway_env: ${{ steps.map.outputs.railway_env }}
      api_url: ${{ steps.map.outputs.api_url }}
      frontend_url: ${{ steps.map.outputs.frontend_url }}
      app_env: ${{ steps.map.outputs.app_env }}
      vercel_prod: ${{ steps.map.outputs.vercel_prod }}
      vercel_org_id: ${{ steps.map.outputs.vercel_org_id }}
      vercel_project_id: ${{ steps.map.outputs.vercel_project_id }}
    steps:
      - id: map
        shell: bash
        run: |
          TARGET="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}"

          if [ "$TARGET" = "main" ] || [ "$TARGET" = "prod" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
            echo "railway_env=production" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "frontend_url=clawarena.io" >> "$GITHUB_OUTPUT"
            echo "app_env=prod" >> "$GITHUB_OUTPUT"
            echo "vercel_prod=true" >> "$GITHUB_OUTPUT"
            echo "vercel_org_id=${{ secrets.VERCEL_ORG_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "vercel_project_id=${{ secrets.VERCEL_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET" = "pre" ]; then
            echo "deploy_env=pre" >> "$GITHUB_OUTPUT"
            echo "railway_env=preview" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api-pre.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "frontend_url=pre.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "app_env=pre" >> "$GITHUB_OUTPUT"
            echo "vercel_prod=false" >> "$GITHUB_OUTPUT"
            echo "vercel_org_id=${{ secrets.VERCEL_ORG_ID_PRE }}" >> "$GITHUB_OUTPUT"
            echo "vercel_project_id=${{ secrets.VERCEL_PROJECT_ID_PRE }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
            echo "railway_env=development" >> "$GITHUB_OUTPUT"
            echo "api_url=https://api-dev.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "frontend_url=dev.clawarena.io" >> "$GITHUB_OUTPUT"
            echo "app_env=dev" >> "$GITHUB_OUTPUT"
            echo "vercel_prod=false" >> "$GITHUB_OUTPUT"
            echo "vercel_org_id=${{ secrets.VERCEL_ORG_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "vercel_project_id=${{ secrets.VERCEL_PROJECT_ID_DEV }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: env-mapping
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ needs.env-mapping.outputs.vercel_project_id }}
      VERCEL_ORG_ID: ${{ needs.env-mapping.outputs.vercel_org_id }}
      NEXT_PUBLIC_API_URL: ${{ needs.env-mapping.outputs.api_url }}
      NEXT_PUBLIC_APP_ENV: ${{ needs.env-mapping.outputs.app_env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Pull Vercel Environment (prod)
        if: needs.env-mapping.outputs.vercel_prod == 'true'
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel Environment (preview)
        if: needs.env-mapping.outputs.vercel_prod != 'true'
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Update Docs URLs
        env:
          FRONTEND_DOMAIN: ${{ needs.env-mapping.outputs.frontend_url }}
        run: |
          # Debug: List files to ensure paths are correct
          echo "Listing frontend/public/docs:"
          ls -R frontend/public/docs || echo "Directory not found"

          # Extract domain from API URL (remove protocol)
          # Ensure NEXT_PUBLIC_API_URL is available
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_API_URL is empty"
            exit 1
          fi

          BACKEND_DOMAIN=$(echo "$NEXT_PUBLIC_API_URL" | sed 's/https:\/\///')
          echo "Updating docs to use backend: $BACKEND_DOMAIN and frontend: $FRONTEND_DOMAIN"

          python3 scripts/update_docs_urls.py "$BACKEND_DOMAIN" "$FRONTEND_DOMAIN"
          
          # Touch files to update timestamps and force rebuild
          echo "Updating file timestamps to force rebuild..."
          find frontend/public/docs -type f -exec touch {} \;
          
          # Verify changes
          echo "Verifying URL replacement:"
          grep -h "api-dev\|api-pre\|api\.clawarena" frontend/public/docs/skill.md | head -3

      - name: Build Frontend (inject NEXT_PUBLIC_API_URL + NEXT_PUBLIC_APP_ENV)
        working-directory: frontend
        run: |
          # Remove .vercel cache to force fresh build
          rm -rf .vercel/cache
          
          NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
          NEXT_PUBLIC_APP_ENV="$NEXT_PUBLIC_APP_ENV" \
          vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Frontend (prod)
        if: needs.env-mapping.outputs.vercel_prod == 'true'
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy Frontend (preview)
        if: needs.env-mapping.outputs.vercel_prod != 'true'
        working-directory: frontend
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    needs: env-mapping
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend (prod)
        if: needs.env-mapping.outputs.deploy_env == 'prod'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
        run: railway up --service backend_prod --environment production --detach --ci

      - name: Deploy Backend (pre)
        if: needs.env-mapping.outputs.deploy_env == 'pre'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRE }}
        run: railway up --service backend_prev --environment preview --detach --ci

      - name: Deploy Backend (dev)
        if: needs.env-mapping.outputs.deploy_env == 'dev'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
        run: railway up --service backend_dev --environment development --detach --ci
